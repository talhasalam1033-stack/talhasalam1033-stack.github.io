<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#566778"/>
    </marker>
  </defs>

  <!-- steps -->
  <text x="60" y="52" font-size="21" font-weight="600" fill="#15212D">1. Pull the arm down 20 mm and hold</text>
  <text x="60" y="84" font-size="21" font-weight="600" fill="#15212D">2. Release and record the free decay</text>

  <!-- loaded arm -->
  <rect x="464" y="104" width="32" height="88" fill="#C9D3DD" stroke="#15212D" stroke-width="1.5"/>
  <text x="510" y="128" font-size="19" fill="#15212D">Loaded steel arm</text>

  <!-- rubber pad -->
  <rect x="430" y="192" width="100" height="10" fill="#3A3A3A"/>
  <text x="540" y="184" font-size="19" fill="#15212D">Rubber pad, 4 mm</text>

  <!-- pull arrow -->
  <path d="M440,118 L440,180" stroke="#1F4E79" stroke-width="3" marker-end="url(#ar)"/>

  <!-- plate, undeformed -->
  <rect x="80" y="202" width="800" height="12" fill="#E7EEF5" stroke="#1F4E79" stroke-width="1.5"/>
  <text x="140" y="194" font-size="19" fill="#15212D">Aluminium plate</text>

  <!-- supports -->
  <path d="M120,214 L104,244 L136,244 Z" fill="#FFFFFF" stroke="#15212D" stroke-width="1.5"/>
  <path d="M840,214 L824,244 L856,244 Z" fill="#FFFFFF" stroke="#15212D" stroke-width="1.5"/>
  <line x1="96" y1="248" x2="144" y2="248" stroke="#15212D" stroke-width="1.5"/>
  <line x1="816" y1="248" x2="864" y2="248" stroke="#15212D" stroke-width="1.5"/>

  <!-- deflected shape -->
  <path d="M120,208 C330,262 630,262 840,208" fill="none" stroke="#1F4E79" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="545" y="282" font-size="17" fill="#1F4E79">Deflected shape before release</text>

  <!-- span dimension -->
  <line x1="120" y1="300" x2="840" y2="300" stroke="#566778" stroke-width="1.2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="120" y1="254" x2="120" y2="308" stroke="#566778" stroke-width="1"/>
  <line x1="840" y1="254" x2="840" y2="308" stroke="#566778" stroke-width="1"/>
  <rect x="410" y="288" width="140" height="24" fill="#FFFFFF"/>
  <text x="480" y="306" font-size="18" fill="#566778" text-anchor="middle">1200 mm span</text>
</svg>
